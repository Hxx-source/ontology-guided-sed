      - 1
      - 1
      - 1
      - 1
      - 1
    decoder: conformer
    decoder_dim: 384
    decoder_expand_rate: 1
    decoder_layer_num: 2
    decoder_pos_emd_len: 500
    hierarchy_projector_dim: 192
    hierarchy_projector_dropout: 0.0
    num_heads: 12
